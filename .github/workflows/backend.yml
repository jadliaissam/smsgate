name: backend

on:
  push:
    paths: ["backend/**", "scripts/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "scripts/**", ".github/workflows/backend.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DB_URL: postgres://smsgate:smsgate@localhost:5432/smsgate?sslmode=disable

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: smsgate
          POSTGRES_PASSWORD: smsgate
          POSTGRES_DB: smsgate
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smsgate"
          --health-interval 2s --health-timeout 5s --health-retries 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: go vet
        run: go vet ./...

      - name: sqlc generated code is up to date
        run: |
          docker run --rm -v "$PWD:/src" -w /src sqlc/sqlc:1.29.0 generate
          git diff --exit-code -- internal/db/dbq

      - name: test (race)
        env:
          TEST_DATABASE_URL: ${{ env.DB_URL }}
        run: go test -race -count=1 ./...

      - name: smoke test
        run: |
          go build -o /tmp/smsgate ./cmd/smsgate
          DATABASE_URL="$DB_URL" APP_ENV=dev /tmp/smsgate > /tmp/smsgate.log 2>&1 &
          for i in $(seq 1 50); do curl -sf localhost:8080/healthz >/dev/null && break; sleep 0.2; done
          ../scripts/smoke.sh /tmp/smsgate.log || { cat /tmp/smsgate.log; exit 1; }

  image:
    # Builds the backend/ image on GitHub. It is pushed to GHCR only from main;
    # on other branches and pull requests it is built to prove it still builds.
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: image reference
        id: ref
        # Image names must be lowercase; the owner may not be.
        run: |
          base="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/smsgate-api"
          { echo "ref=$base:$GITHUB_SHA"; echo "latest=$base:latest"; } >> "$GITHUB_OUTPUT"

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          build-args: REVISION=${{ github.sha }}
          tags: |
            ${{ steps.ref.outputs.ref }}
            ${{ steps.ref.outputs.latest }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=smsgate-api
          cache-to: type=gha,mode=max,scope=smsgate-api

  deploy:
    # CapRover only pulls the image built above and runs it; nothing is built
    # on the server. CapRover needs a registry login for ghcr.io (Cluster ->
    # Docker Registry; a PAT with read:packages) unless the package is public.
    # The CLI returns before the new container is up, so the job then waits
    # until the public site reports this commit as its revision.
    # Required repository settings:
    #   secrets.CAPROVER_URL        e.g. https://captain.example.com
    #   secrets.CAPROVER_APP_TOKEN  app: Deployment -> "Enable App Token"
    #   vars.PUBLIC_WEB_URL         public web origin (default below)
    #   vars.CAPROVER_APP           CapRover app name
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: deploy-production-smsgate-api
      cancel-in-progress: false
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: deploy image to CapRover
        env:
          CAPROVER_URL: ${{ secrets.CAPROVER_URL }}
          APP_TOKEN: ${{ secrets.CAPROVER_APP_TOKEN }}
          APP_NAME: ${{ vars.CAPROVER_APP || 'smsgate-api' }}
          IMAGE: ${{ needs.image.outputs.ref }}
        run: |
          test -n "$CAPROVER_URL" && test -n "$APP_TOKEN" && test -n "$APP_NAME" \
            || { echo "CAPROVER_URL and CAPROVER_APP_TOKEN (secrets) and the app name must be set"; exit 1; }
          npx --yes caprover@2.4.4 deploy \
            --caproverUrl "$CAPROVER_URL" \
            --appToken "$APP_TOKEN" \
            --appName "$APP_NAME" \
            --imageName "$IMAGE"

      - name: wait until the new revision is serving
        env:
          URL: ${{ vars.PUBLIC_WEB_URL || 'https://smsgate-web.captain-1.duckdns.org' }}
        run: |
          URL="${URL%/}"
          live=
          deadline=$((SECONDS + 300))
          while [ "$SECONDS" -lt "$deadline" ]; do
            live=$(curl -fsS --max-time 5 "$URL/healthz" 2>/dev/null | jq -r '.revision // empty' 2>/dev/null) || live=
            if [ "$live" = "$GITHUB_SHA" ]; then
              echo "revision $GITHUB_SHA is live"
              exit 0
            fi
            sleep 5
          done
          echo "::error::deploy not confirmed: after 5 minutes the API (via the web proxy) /healthz reports revision '${live:-unreachable}', expected $GITHUB_SHA"
          exit 1
