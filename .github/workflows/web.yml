name: web

on:
  push:
    paths: ["web/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: lint
        run: npm run lint

      - name: typecheck
        run: npm run typecheck

      - name: test
        run: npm test

      - name: build (includes bundle budget)
        run: npm run build

  image:
    # Builds the web/ image on GitHub. It is pushed to GHCR only from main;
    # on other branches and pull requests it is built to prove it still builds.
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: image reference
        id: ref
        # Image names must be lowercase; the owner may not be.
        run: |
          base="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/smsgate-web"
          { echo "ref=$base:$GITHUB_SHA"; echo "latest=$base:latest"; } >> "$GITHUB_OUTPUT"

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: web
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          build-args: REVISION=${{ github.sha }}
          tags: |
            ${{ steps.ref.outputs.ref }}
            ${{ steps.ref.outputs.latest }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=smsgate-web
          cache-to: type=gha,mode=max,scope=smsgate-web

  deploy:
    # CapRover only pulls the image built above and runs it; nothing is built
    # on the server. CapRover needs a registry login for ghcr.io (Cluster ->
    # Docker Registry; a PAT with read:packages) unless the package is public.
    # The CLI returns before the new container is up, so the job then waits
    # until the public site reports this commit as its revision.
    # Required repository settings:
    #   secrets.CAPROVER_URL        e.g. https://captain.example.com
    #   secrets.CAPROVER_WEB_APP_TOKEN  app: Deployment -> "Enable App Token"
    #   vars.PUBLIC_WEB_URL         public web origin (default below)
    #   vars.CAPROVER_WEB_APP           CapRover app name
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: deploy-production-smsgate-web
      cancel-in-progress: false
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: deploy image to CapRover
        env:
          CAPROVER_URL: ${{ secrets.CAPROVER_URL }}
          APP_TOKEN: ${{ secrets.CAPROVER_WEB_APP_TOKEN }}
          APP_NAME: ${{ vars.CAPROVER_WEB_APP || 'smsgate-web' }}
          IMAGE: ${{ needs.image.outputs.ref }}
        run: |
          test -n "$CAPROVER_URL" && test -n "$APP_TOKEN" && test -n "$APP_NAME" \
            || { echo "CAPROVER_URL and CAPROVER_WEB_APP_TOKEN (secrets) and the app name must be set"; exit 1; }
          npx --yes caprover@2.4.4 deploy \
            --caproverUrl "$CAPROVER_URL" \
            --appToken "$APP_TOKEN" \
            --appName "$APP_NAME" \
            --imageName "$IMAGE"

      - name: wait until the new revision is serving
        env:
          URL: ${{ vars.PUBLIC_WEB_URL || 'https://smsgate-web.captain-1.duckdns.org' }}
        run: |
          URL="${URL%/}"
          live=
          for _ in $(seq 1 60); do
            live=$(curl -fsS --max-time 10 "$URL/revision.txt" 2>/dev/null | tr -d '[:space:]') || live=
            if [ "$live" = "$GITHUB_SHA" ]; then
              echo "revision $GITHUB_SHA is live"
              exit 0
            fi
            sleep 5
          done
          echo "::error::deploy not confirmed: after 5 minutes /revision.txt reports revision '${live:-unreachable}', expected $GITHUB_SHA"
          exit 1
