<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f8f9fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0c10" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="SMSGate — send SMS through your own Android phones with a simple HTTP API." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>SMSGate</title>
    <!-- Apply the saved theme before first paint (no flash). Keep in sync with src/ui/theme.ts. -->
    <script>
      ;(function () {
        try {
          var t = localStorage.getItem('smsgate-theme')
          var d = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          var r = document.documentElement
          if (d) r.classList.add('dark')
          r.style.colorScheme = d ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
